# /etc/nginx/sites-available/volver-a-verde
# sudo ln -s /etc/nginx/sites-available/volver-a-verde /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8000;                       # red local: http://IP-DEL-SERVIDOR:8000
    server_name _;
    root /var/www/volver-a-verde/public;
    index index.php;

    client_max_body_size 80M;          # hasta 5 comprobantes de 15 MB

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ajusta a tu versión de PHP
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
